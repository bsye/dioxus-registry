[workspace]
resolver = "3"
members = ["primitives", "preview"]

[workspace.dependencies]
dioxus = "=0.8.0-alpha.3"
dioxus-icons = { version = "=0.2.0-alpha.3", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", rev = "9db1d9a8a60a7e05bc1284ad6bd1d16ea74bbed3", default-features = false }
dioxus-registry-primitives = { path = "primitives" }
dioxus-ssr = "=0.8.0-alpha.3"

[profile.dev]
debug = 0
